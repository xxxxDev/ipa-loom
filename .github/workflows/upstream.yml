name: Upstream compatibility
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-compatibility
  cancel-in-progress: false
jobs:
  candidates:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Detect and build candidates without private data
        run: python3 -B scripts/check_updates.py --verify --report "$RUNNER_TEMP/upstream-report.json"
      - name: Preserve redacted compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-compatibility
          path: ${{ runner.temp }}/upstream-report.json
          retention-days: 14
