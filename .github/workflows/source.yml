name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-source:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Committed public inventory, Python syntax and paired documents
        run: python3 -B scripts/check_public.py --ref HEAD
      - name: Working-tree inventory and Python syntax
        run: python3 -B scripts/check_public.py
      - name: Launcher syntax
        run: bash -n ipa-loom.command
      - name: Validate release tag format
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -B scripts/check_release.py "$RELEASE_TAG"
